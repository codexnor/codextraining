function seed(){const pid=eid();return {version:1,profiles:[{id:pid,name:'Min profil',createdAt:new Date().toISOString(),favorites:[],goals:[]}],activeProfileId:pid,workouts:[],templates:[],customExercises:[],drafts:{},settings:{theme:'dark',increment:2.5,restSeconds:90},backupAt:null}}
let S=null,db=null,storageMode='idb',saveTimer=0,tab='home',modal=null,filterGroup='Alle',exerciseQuery='',modalQuery='',historyCursor=new Date(),selectedDay='',analyticsEx='',restUntil=0,restTicker=0,toastTicker=0;
function profile(){return S.profiles.find(p=>p.id===S.activeProfileId)||S.profiles[0]}
function workouts(){return S.workouts.filter(w=>w.profileId===profile().id).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function exercises(){return [...BUILTINS,...S.customExercises.filter(x=>x.profileId===profile().id)]}
function getEx(id){return exercises().find(x=>x.id===id)||{id,name:'Slettet øvelse',group:'Annet',equipment:'Ukjent'}}
function goal(exId){return (profile().goals||[]).find(g=>g.exId===exId)}
function workSets(entry){return (entry.sets||[]).filter(s=>s.kind!=='warmup'&&s.done&&s.reps>0)}
function vol(w){return (w.entries||[]).reduce((n,e)=>n+workSets(e).reduce((a,s)=>a+s.weight*s.reps,0),0)}
function e1rm(s){return s.reps>0&&s.reps<=12&&s.weight>0?s.weight*(1+s.reps/30):0}
function exerciseLogs(exId,excludeId=''){return workouts().filter(w=>w.id!==excludeId).flatMap(w=>(w.entries||[]).filter(e=>e.exId===exId).map(e=>({w,sets:workSets(e)}))).filter(x=>x.sets.length).sort((a,b)=>String(b.w.date).localeCompare(String(a.w.date)))}
function exStats(exId){const logs=exerciseLogs(exId),sets=logs.flatMap(l=>l.sets);return {logs,bestWeight:sets.length?Math.max(...sets.map(s=>s.weight)):0,best1rm:sets.length?Math.max(...sets.map(e1rm)):0,bestVol:logs.length?Math.max(...logs.map(l=>l.sets.reduce((sum,s)=>sum+s.weight*s.reps,0))):0,totalSets:sets.length}}
function lastSets(exId,editing=''){const l=exerciseLogs(exId,editing)[0];return l?l.sets:[]}
function recommend(exId){const sets=lastSets(exId);if(!sets.length)return null;const step=Math.max(.5,safeNum(S.settings.increment,2.5));const g=goal(exId);const maxReps=g?g.targetReps:10;const enough=sets.every(s=>s.reps>=maxReps);const weight=Math.max(...sets.map(s=>s.weight));if(!weight)return null;const next=enough?Math.round((weight+step)*100)/100:weight;return {weight:next,reps:enough?Math.max(6,maxReps-2):maxReps,increase:enough};}
function goalResult(g){const sets=exerciseLogs(g.exId).flatMap(l=>l.sets);const qualifying=sets.filter(s=>s.reps>=g.targetReps);const achieved=qualifying.some(s=>s.weight>=g.targetWeight);const best=qualifying.length?Math.max(...qualifying.map(s=>s.weight)):0;return {achieved,best,pct:g.targetWeight>0?Math.round(Math.min(100,best/g.targetWeight*100)):0}}
function personalRecords(){let count=0;const previous={};for(const w of workouts().slice().reverse()){for(const ent of w.entries||[]){const arr=workSets(ent);if(!arr.length)continue;const weight=Math.max(...arr.map(s=>s.weight)),est=Math.max(...arr.map(e1rm));const prev=previous[ent.exId]||{weight:0,est:0};if(prev.weight>0&&(weight>prev.weight+.0001||est>prev.est+.0001))count++;else if(!prev.weight&&weight>0)count++;previous[ent.exId]={weight:Math.max(prev.weight,weight),est:Math.max(prev.est,est)}}}return count}
function recentPRs(record,prior){let n=0;for(const entry of record.entries){const ss=workSets(entry);if(!ss.length)continue;const prev=prior.filter(w=>w.profileId===record.profileId).flatMap(w=>w.entries.filter(e=>e.exId===entry.exId)).flatMap(workSets);const best=prev.length?Math.max(...prev.map(s=>s.weight)):0;const cur=Math.max(...ss.map(s=>s.weight));if(cur>best&&cur>0)n++;}return n}
function draft(){return S.drafts[profile().id]||null}
function update(){saveSoon();render()}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveState().catch(e=>{console.error('Lagring feilet',e);toast('Automatisk lagring feilet – eksporter JSON')}),110)}
function idbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open('codex-training-db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('store'))req.result.createObjectStore('store')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function idbGet(){return new Promise((res,rej)=>{let t=db.transaction('store','readonly').objectStore('store').get('state');t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
function idbPut(v){return new Promise((res,rej)=>{let t=db.transaction('store','readwrite');t.objectStore('store').put(v,'state');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function loadState(){try{db=await idbOpen();storageMode='idb';return await idbGet()}catch(e){console.warn('IndexedDB utilgjengelig',e);storageMode='local';try{return JSON.parse(localStorage.getItem('codex-training-backup')||'null')}catch{storageMode='memory';return null}}}
async function saveState(){if(storageMode==='idb'&&db)await idbPut(S);else if(storageMode==='local')localStorage.setItem('codex-training-backup',JSON.stringify(S));else throw Error('Vedvarende lagring er ikke tilgjengelig')}
function toast(message){document.getElementById('toast-root').innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toastTicker);toastTicker=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3300)}
function nav(){return `<nav class="bottom-nav" aria-label="Hovedmeny"><div class="nav-inner">${NAV.map(([id,label,ic])=>`<button type="button" class="nav-btn ${tab===id?'active':''}" data-action="tab" data-id="${id}" aria-current="${tab===id?'page':'false'}">${icon(ic)}<span>${label}</span></button>`).join('')}</div></nav>`}
function render(){if(!S)return;document.documentElement.dataset.theme=S.settings.theme==='light'?'light':'dark';document.querySelector('meta[name="theme-color"]').content=S.settings.theme==='light'?'#f3f6fa':'#0b111c';const p=profile();const pages={home:renderHome,train:renderTrain,exercises:renderExercises,history:renderHistory,analysis:renderAnalysis};document.getElementById('app').innerHTML=`<header><div class="top"><div class="brand"><div class="logo">CT</div><div><div class="brand-name">CODEX TRAINING</div><div class="subname">Din trening. Din progresjon.</div></div></div><div class="head-actions"><button class="icon-btn profile-btn" data-action="profiles" aria-label="Bytt bruker">${icon('house',16)} <span style="overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span></button><button class="icon-btn" data-action="settings" aria-label="Innstillinger">${icon('gear',19)}</button></div></div></header><main class="page" id="main-content">${(pages[tab]||renderHome)()}</main>${nav()}`;updateTimerDisplay();}
function renderHome(){const ws=workouts(),now=new Date(),monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(now.getDate()-(now.getDay()+6)%7);const weekly=ws.filter(w=>new Date(w.date)>=monday);const volume=weekly.reduce((s,w)=>s+vol(w),0);const rec=ws[0];const d=draft();const goals=(profile().goals||[]).slice(0,3);return `<div class="title-row"><div><div class="eyebrow">Oversikt</div><h1>Hei, ${esc(profile().name)} 👋</h1><p class="muted small" style="margin-top:6px">${formatDate(dateLocal(),{weekday:'long',day:'numeric',month:'long'})}</p></div></div>
<div class="card hero"><div class="eyebrow">Denne uken</div><h1 style="font-size:37px">${weekly.length} <span style="font-size:17px;font-weight:600">økter</span></h1><div class="mini-stats"><div><b>${fmt(volume)} kg</b><span class="muted small">Treningsvolum</span></div><div><b>${weekly.reduce((n,w)=>n+w.entries.reduce((sum,e)=>sum+workSets(e).length,0),0)}</b><span class="muted small">Arbeidssett</span></div><div><b>${personalRecords()}</b><span class="muted small">PR totalt</span></div></div></div>
<div class="section"><h2>Kom i gang</h2></div><div class="stack"><button class="btn primary block" data-action="start-empty">${icon(d?'forward':'plus',19)} ${d?'Fortsett pågående økt':'Start en treningsøkt'}</button>${d?`<div class="hint">Pågående: ${esc(d.name)} · ${d.entries.length} øvelser</div>`:''}</div>
${renderTemplates('home')}
<div class="section"><h2>Siste økt</h2><button class="link-btn" data-action="tab" data-id="history">Historikk ›</button></div>${rec?`<div class="card item-link" data-action="history-view" data-id="${esc(rec.id)}"><div class="row between"><div><strong>${esc(rec.name)}</strong><p class="muted small">${formatDate(rec.date)} · ${rec.entries.length} øvelser</p></div>${icon('forward')}</div><div class="lastline">${rec.entries.slice(0,4).map(e=>`<span>${esc(getEx(e.exId).name)} · ${workSets(e).length} sett</span>`).join('')}</div></div>`:`<div class="card empty"><div class="em">🏋️</div><strong>Ingen lagrede økter ennå</strong>Start din første økt for å se historikk og progresjon.</div>`}
${goals.length?`<div class="section"><h2>Dine mål</h2><button class="link-btn" data-action="tab" data-id="analysis">Alle mål ›</button></div>${goals.map(g=>goalCard(g)).join('')}`:''}
${storageMode==='local'?`<div class="alert" style="margin-top:14px">Nettleseren bruker reservelagring. Ta regelmessig JSON-sikkerhetskopi.</div>`:storageMode==='memory'?`<div class="alert" style="margin-top:14px;border-color:var(--red)">Denne visningen har ikke tilgang til lokal lagring. Data kan gå tapt ved lukking. Eksporter JSON, og åpne appen via GitHub Pages.</div>`:''}`}

function renderTrain(){const d=draft();if(!d)return `<div class="title-row"><div><div class="eyebrow">Treningslogg</div><h1>Ny treningsøkt</h1><p class="muted small">Loggfør kg, repetisjoner og sett.</p></div></div><button class="btn primary block" data-action="start-empty">${icon('plus')} Start tom økt</button>${renderTemplates('train')}${workouts()[0]?`<div class="section"><h2>Gjenta siste økt</h2></div><button class="btn block" data-action="repeat-last">${icon('forward')} Bruk øvelsene fra ${esc(workouts()[0].name)}</button>`:''}`;
return `<div class="title-row"><div><div class="eyebrow">Pågående økt ${d.editingId?'· redigering':''}</div><h1>${d.editingId?'Rediger økt':'Registrer treningen'}</h1><p class="muted small">Endringer lagres automatisk lokalt.</p></div><button class="btn tiny-btn" data-action="discard-draft">${icon('close',16)} ${d.editingId?'Avbryt':'Avslutt'}</button></div>

${d.entries.length?d.entries.map((e,i)=>renderExerciseLog(e,i)).join(''):`<div class="card empty"><div class="em">💪</div><strong>Legg til første øvelse</strong>Velg fra øvelsesbiblioteket for å starte loggføringen.</div>`}

function renderExerciseLog(e,index){const def=getEx(e.exId),previous=lastSets(e.exId,draft().editingId||''),rec=recommend(e.exId);return `<section class="exercise-log" data-entry="${esc(e.id)}"><div class="workout-h"><div class="grow"><strong>${index+1}. ${esc(def.name)}</strong><div class="muted tiny">${esc(def.group)} · ${esc(def.equipment)}</div></div><div class="row" style="gap:5px"><button class="circle" data-action="detail-ex" data-id="${esc(e.exId)}" aria-label="Øvelsesdetaljer">${icon('chart',16)}</button><button class="circle" data-action="remove-ex" data-id="${esc(e.id)}" aria-label="Fjern øvelse">${icon('trash',16)}</button></div></div>

<table class="set-table"><thead><tr><th>Type</th><th>Forrige</th><th>Kg</th><th>Reps</th><th>Ferdig</th></tr></thead><tbody>${e.sets.map((s,i)=>`<tr><td><button class="kind ${s.kind==='warmup'?'warmup':''}" data-action="toggle-kind" data-entry="${esc(e.id)}" data-set="${esc(s.id)}" title="Veksle oppvarming/arbeidssett">${s.kind==='warmup'?'O':'A'}</button></td><td><span class="prev">${previous[i]?`${fmt(previous[i].weight,2)}×${previous[i].reps}`:'–'}</span></td><td><input type="number" min="0" max="2000" step="0.5" inputmode="decimal" aria-label="Vekt sett ${i+1}" data-bind="set-weight" data-entry="${esc(e.id)}" data-set="${esc(s.id)}" value="${s.weight??0}"></td><td><input type="number" min="0" max="500" step="1" inputmode="numeric" aria-label="Repetisjoner sett ${i+1}" data-bind="set-reps" data-entry="${esc(e.id)}" data-set="${esc(s.id)}" value="${s.reps??8}"></td><td><button class="check ${s.done?'checked':''}" data-action="toggle-done" data-entry="${esc(e.id)}" data-set="${esc(s.id)}" aria-label="${s.done?'Marker ikke fullført':'Marker som fullført'}">${s.done?icon('check',20):'○'}</button></td></tr>`).join('')}</tbody></table>
<div class="set-actions"><button class="btn tiny-btn" data-action="add-set" data-id="${esc(e.id)}">${icon('plus',15)} Legg til sett</button><button class="btn tiny-btn ghost" data-action="remove-set" data-id="${esc(e.id)}" ${e.sets.length<=1?'disabled':''}>${icon('trash',15)} Fjern siste</button></div>${rec?`<div class="alert" style="margin-top:11px">${icon('target',15)} Forslag neste gang: <strong>${fmt(rec.weight,2)} kg × ${rec.reps}</strong> ${rec.increase?'(økning)':'(behold belastningen)'}. Juster etter teknikk og form.</div>`:''}</section>`}
function renderExercises(){return `<div class="title-row"><div><div class="eyebrow">Bibliotek</div><h1>Øvelser</h1><p class="muted small">${exercises().length} øvelser · egne øvelser og favoritter</p></div><button class="btn tiny-btn" data-action="custom-ex">${icon('plus',16)} Ny</button></div><div class="search"><span class="glass">⌕</span><input id="exercise-search" placeholder="Søk etter øvelse …" value="${esc(exerciseQuery)}" data-bind="exercise-search" autocomplete="off"></div><div class="chip-row">${GROUPS.map(g=>`<button class="chip ${g===filterGroup?'active':''}" data-action="category" data-id="${esc(g)}">${g}</button>`).join('')}</div><div class="card pad-sm" id="exercise-list">${renderExerciseRows(exerciseQuery,filterGroup,false)}</div>`}
function filteredEx(q,group){const fav=profile().favorites||[],search=String(q).toLocaleLowerCase('nb-NO').trim();return exercises().filter(e=>(group==='Alle'||group==='Favoritter'&&fav.includes(e.id)||e.group===group)&&(!search||`${e.name} ${e.group} ${e.equipment}`.toLocaleLowerCase('nb-NO').includes(search))).sort((a,b)=>a.name.localeCompare(b.name,'nb'))}
function renderExerciseRows(q,group,choose){const arr=filteredEx(q,group);if(!arr.length)return `<div class="empty">Ingen øvelser funnet.</div>`;return arr.map(e=>`<div class="exercise-row"><div class="exercise-ico">${GROUPICON[e.group]||'🏋️'}</div><div class="grow ${choose?'':'item-link'}" ${choose?'':'data-action="detail-ex" data-id="'+esc(e.id)+'"'}><div class="exercise-title">${esc(e.name)}</div><div class="exercise-sub">${esc(e.group)} · ${esc(e.equipment)}</div></div>${choose?`<button class="circle" data-action="select-ex" data-id="${esc(e.id)}" aria-label="Legg til øvelse">${icon('plus',18)}</button>`:`<button class="circle ${profile().favorites?.includes(e.id)?'fav':''}" data-action="favorite" data-id="${esc(e.id)}" aria-label="Endre favoritt">${icon('star',18)}</button>`}</div>`).join('')}
function renderHistory(){const ws=workouts(),year=historyCursor.getFullYear(),month=historyCursor.getMonth(),startDay=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate(),key=year+'-'+String(month+1).padStart(2,'0');const counts={};ws.forEach(w=>counts[w.date.slice(0,10)]=(counts[w.date.slice(0,10)]||0)+1);const daysHtml=Array.from({length:startDay},()=>`<div></div>`).join('')+Array.from({length:days},(_,i)=>{const dd=key+'-'+String(i+1).padStart(2,'0');return `<button class="day ${counts[dd]?'has':''} ${selectedDay===dd?'selected':''}" data-action="choose-day" data-id="${dd}" aria-label="${dd}, ${counts[dd]||0} økter">${i+1}${counts[dd]?'<span class="dot"></span>':''}</button>`}).join('');const display=selectedDay?ws.filter(w=>w.date.slice(0,10)===selectedDay):ws;return `<div class="title-row"><div><div class="eyebrow">Treningsdagbok</div><h1>Historikk</h1><p class="muted small">${ws.length} fullførte økter totalt</p></div></div><div class="card"><div class="row between" style="margin-bottom:12px"><button class="icon-btn" data-action="month-prev" aria-label="Forrige måned">${icon('back')}</button><strong>${new Date(year,month,1).toLocaleDateString('nb-NO',{month:'long',year:'numeric'})}</strong><button class="icon-btn" data-action="month-next" aria-label="Neste måned">${icon('forward')}</button></div><div class="calendar">${['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map(x=>`<div class="day-name">${x}</div>`).join('')}${daysHtml}</div><p class="muted tiny" style="margin-top:10px">Grønne dager har registrerte økter. Trykk på en dato for filtrering.</p></div><div class="section"><h2>${selectedDay?'Økter '+formatDate(selectedDay):'Alle økter'}</h2>${selectedDay?`<button class="link-btn" data-action="clear-day">Vis alle</button>`:''}</div>${display.length?display.map(w=>`<div class="card history-card" data-action="history-view" data-id="${esc(w.id)}"><div class="row between"><div class="grow"><h3>${esc(w.name)}</h3><p class="muted small">${formatDate(w.date,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</p></div><span class="badge green">${w.entries.length} øvelser</span>${icon('forward',17)}</div><div class="history-exs">${w.entries.map(e=>esc(getEx(e.exId).name)).join(' · ')}</div><div class="lastline"><span>${w.entries.reduce((n,e)=>n+workSets(e).length,0)} arbeidssett</span><span>${fmt(vol(w))} kg volum</span></div></div>`).join(''):`<div class="card empty"><div class="em">🗓️</div><strong>Ingen økter${selectedDay?' på denne datoen':''}</strong>Loggførte økter vises her.</div>`}`}
function goalCard(g){const r=goalResult(g);return `<div class="card pad-sm item-link" data-action="detail-ex" data-id="${esc(g.exId)}"><div class="row between"><strong>${esc(getEx(g.exId).name)}</strong><span class="badge ${r.achieved?'green':''}">${r.achieved?'Oppnådd':r.pct+' %'}</span></div><div class="muted small">Mål: ${fmt(g.targetWeight,2)} kg × ${g.targetReps} repetisjoner</div><div class="progress"><div style="width:${r.pct}%"></div></div><div class="tiny muted">${r.best?`Beste registrering med minst ${g.targetReps} reps: ${fmt(r.best,2)} kg`:'Ingen kvalifiserende sett registrert ennå'}</div></div>`}
function chartSvg(exId){const logs=exerciseLogs(exId).slice(0,10).reverse(),pts=logs.map(({w,sets})=>({date:w.date,v:Math.max(...sets.map(s=>s.weight))}));if(!pts.length)return `<div class="empty">Loggfør øvelsen for å se utviklingen.</div>`;const width=340,height=170,left=32,right=12,top=17,bottom=33,rangeW=width-left-right,rangeH=height-top-bottom,max=Math.max(5,...pts.map(x=>x.v)),ymax=Math.ceil(max/5)*5;const points=pts.map((p,i)=>({x:left+(pts.length===1?rangeW/2:rangeW*i/(pts.length-1)),y:top+rangeH-(p.v/ymax)*rangeH,...p}));const path=points.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');const ticks=[0,.5,1].map(t=>{const y=top+rangeH*(1-t);return `<path d="M${left} ${y}H${width-right}" stroke="currentColor" opacity=".12"/><text x="${left-5}" y="${y+4}" font-size="10" text-anchor="end" fill="currentColor" opacity=".6">${fmt(ymax*t)}</text>`}).join('');return `<svg class="chart" role="img" aria-label="Utvikling i maksimal arbeidsvekt, siste ${pts.length} økter" viewBox="0 0 ${width} ${height}">${ticks}<path d="${path}" stroke="var(--green)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--green)"/><text x="${p.x}" y="${Math.max(10,p.y-10)}" font-size="10" text-anchor="middle" fill="var(--text)">${fmt(p.v,2)}</text>`).join('')}<text x="${left}" y="${height-5}" font-size="10" fill="currentColor" opacity=".65">${formatDate(pts[0].date,{day:'numeric',month:'short'})}</text><text x="${width-right}" y="${height-5}" font-size="10" text-anchor="end" fill="currentColor" opacity=".65">${formatDate(pts[pts.length-1].date,{day:'numeric',month:'short'})}</text></svg>`}
function renderAnalysis(){const ws=workouts(),all=exercises(),used=[...new Set(ws.flatMap(w=>w.entries.map(e=>e.exId)))],activeEx=all.find(x=>x.id===analyticsEx)||getEx(used[0]||BUILTINS[0].id);analyticsEx=activeEx.id;const st=exStats(activeEx.id),current=(profile().goals||[]);const today=new Date(),cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-28);const priorCutoff=new Date(cutoff);priorCutoff.setDate(priorCutoff.getDate()-28);const newWs=ws.filter(w=>new Date(w.date)>=cutoff),oldWs=ws.filter(w=>new Date(w.date)>=priorCutoff&&new Date(w.date)<cutoff);const nowVol=newWs.reduce((sum,w)=>sum+vol(w),0),oldVol=oldWs.reduce((sum,w)=>sum+vol(w),0);return `<div class="title-row"><div><div class="eyebrow">Statistikk</div><h1>Din progresjon</h1><p class="muted small">Analyser basert på dine registrerte økter</p></div></div><div class="stat-grid"><div class="card stat"><div class="label">Økter siste 28 dager</div><div class="value">${newWs.length}</div><div class="tiny muted">${oldWs.length} forrige 28 dager</div></div><div class="card stat"><div class="label">Volum siste 28 dager</div><div class="value">${fmt(nowVol)} <span class="unit">kg</span></div><div class="tiny muted">${oldVol?((nowVol-oldVol)/oldVol>=0?'+':'')+fmt((nowVol-oldVol)/oldVol*100,1)+' % mot forrige':'Ingen tidligere periode'}</div></div><div class="card stat"><div class="label">Registrerte arbeidssett</div><div class="value">${ws.reduce((sum,w)=>sum+w.entries.reduce((n,e)=>n+workSets(e).length,0),0)}</div><div class="tiny muted">Alle økter</div></div><div class="card stat"><div class="label">PR-hendelser</div><div class="value">${personalRecords()}</div><div class="tiny muted">Ny belastning eller est. 1RM</div></div></div><div class="section"><h2>Utvikling per øvelse</h2></div><div class="card"><div class="field"><label for="analysis-ex">Velg øvelse</label><select data-bind="analytics-ex" id="analysis-ex">${all.map(e=>`<option value="${esc(e.id)}" ${e.id===activeEx.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="row between" style="margin:17px 0 7px"><div><div class="muted tiny">Beste arbeidsvekt</div><h2 style="font-size:25px">${st.totalSets?fmt(st.bestWeight,2)+' kg':'–'}</h2></div><div style="text-align:right"><div class="muted tiny">Estimert 1RM</div><h2 style="font-size:25px">${st.best1rm?fmt(st.best1rm,1)+' kg':'–'}</h2></div></div><p class="muted tiny" style="margin-bottom:10px">Maksimal arbeidsvekt per økt (oppvarming utelatt)</p>${chartSvg(activeEx.id)}<div class="separator"></div><div class="row between"><div><div class="muted tiny">Rekord: øvelsesvolum</div><strong>${fmt(st.bestVol)} kg</strong></div><button class="btn tiny-btn" data-action="detail-ex" data-id="${esc(activeEx.id)}">${icon('target',15)} Sett mål</button></div></div><div class="section"><h2>Styrkemål</h2></div>${current.length?current.map(goalCard).join(''):`<div class="card empty"><strong>Ingen mål opprettet</strong>Åpne en øvelse og sett ønsket belastning og repetisjoner.</div>`}<p class="privacy" style="margin-top:14px">Estimert 1RM beregnes bare for sett med 1–12 repetisjoner (Epleys formel). En estimert 1RM er ikke et testet maksløft. Volum er summen av kg × repetisjoner for utførte arbeidssett.</p>`}
function modalShell(title,body,large=false){return `<div class="overlay" data-action="close-backdrop"><div class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${esc(title)}</h2><button class="icon-btn modal-close" data-action="close-modal" aria-label="Lukk">${icon('close')}</button></div><div class="modal-body">${body}</div></div></div>`}

if(t==='choose'){title='Legg til øvelse';large=true;html=`<div class="search"><span class="glass">⌕</span><input id="choose-search" data-bind="choose-search" placeholder="Søk blant ${exercises().length} øvelser …" autocomplete="off" value="${esc(modalQuery)}"></div><div id="choose-list" style="margin-top:12px">${renderExerciseRows(modalQuery,'Alle',true)}</div>`}
if(t==='profiles'){title='Brukerprofiler';html=`<p class="muted small" style="margin-bottom:12px">Hver bruker har egne treningsøkter, mål og rekorder på denne enheten.</p>${S.profiles.map(p=>`<div class="settings-row"><div class="grow"><strong>${esc(p.name)}</strong>${p.id===profile().id?` <span class="badge green">Aktiv</span>`:''}<div class="muted tiny">${S.workouts.filter(w=>w.profileId===p.id).length} økter</div></div><button class="btn tiny-btn" data-action="switch-profile" data-id="${esc(p.id)}">${p.id===profile().id?'Valgt':'Velg'}</button><button class="circle" data-action="rename-profile" data-id="${esc(p.id)}" aria-label="Gi nytt navn">${icon('edit',16)}</button><button class="circle" data-action="delete-profile" data-id="${esc(p.id)}" aria-label="Slett profil">${icon('trash',16)}</button></div>`).join('')}<div class="separator"></div><div class="field"><label for="profile-name">Ny profil</label><input id="profile-name" maxlength="40" placeholder="Navn"></div><button class="btn primary block" style="margin-top:10px" data-action="create-profile">${icon('plus',17)} Opprett profil</button>`}
if(t==='settings'){title='Innstillinger';html=`<div class="settings-row"><div><strong>Utseende</strong><div class="muted tiny">Samme design på mobil og PC</div></div><select data-bind="theme" aria-label="Velg tema"><option value="dark" ${S.settings.theme==='dark'?'selected':''}>Mørkt</option><option value="light" ${S.settings.theme==='light'?'selected':''}>Lyst</option></select></div><div class="settings-row"><div><strong>Vektsteg</strong><div class="muted tiny">Ved foreslått progresjon</div></div><select data-bind="increment" aria-label="Vektsteg">${[.5,1,1.25,2,2.5,5].map(v=>`<option value="${v}" ${Number(S.settings.increment)===v?'selected':''}>${fmt(v,2)} kg</option>`).join('')}</select></div><div class="settings-row"><div><strong>Hviletimer</strong><div class="muted tiny">Tid mellom sett</div></div><select data-bind="rest-seconds" aria-label="Hviletimer">${[60,90,120,150,180,240].map(v=>`<option value="${v}" ${Number(S.settings.restSeconds)===v?'selected':''}>${v} sek</option>`).join('')}</select></div><div class="section"><h2>Data og sikkerhet</h2></div><button class="btn block" data-action="backup">${icon('download')} Sikkerhetskopi / gjenoppretting</button><div class="alert" style="margin-top:12px">Alt lagres lokalt på denne enheten. Andre telefoner får ikke tilgang til samme treningsdata automatisk.</div><div class="section"><h2>Om appen</h2></div><p class="privacy">Codex Training v1.0 · ${BUILTINS.length} innebygde øvelser · ingen innlogging, sporing eller eksterne biblioteker. Bruk JSON-eksport jevnlig. Lagring kan slettes hvis du rydder nettstedsdata eller bytter telefon.</p>`}
if(t==='backup'){title='Sikkerhetskopi';html=`<p class="muted small">Eksporterer alle profiler, økter, mål, maler og pågående økter i én JSON-fil.</p><div class="card" style="margin-top:15px"><strong>Lag sikkerhetskopi</strong><p class="muted small" style="margin:6px 0 13px">Sist eksportert: ${S.backupAt?formatDate(S.backupAt):'Aldri'}</p><button class="btn primary block" data-action="export-json">${icon('download')} Eksporter JSON</button></div><div class="card" style="margin-top:12px"><strong>Gjenopprett fra fil</strong><p class="muted small" style="margin:6px 0 13px">Dette vil erstatte alle lokale treningsdata. Ta backup først.</p><label class="btn block" for="backup-file">${icon('upload')} Velg JSON-fil</label><input id="backup-file" type="file" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden" /></div><p class="privacy" style="margin-top:12px">Ta gjerne sikkerhetskopi etter hver uke med trening og lagre den i Filer eller en valgfri skylagring.</p>`}
if(t==='custom'){title='Ny øvelse';html=`<div class="stack"><div class="field"><label for="custom-name">Øvelsesnavn</label><input id="custom-name" maxlength="75" placeholder="F.eks. Min egen øvelse"></div><div class="field"><label for="custom-group">Muskelgruppe</label><select id="custom-group">${GROUPS.filter(g=>g!=='Alle'&&g!=='Favoritter').map(g=>`<option>${g}</option>`).join('')}</select></div><div class="field"><label for="custom-equip">Utstyr</label><select id="custom-equip">${['Stang','Manualer','Maskin','Kabel','Kroppsvekt','Kettlebell','Annet'].map(g=>`<option>${g}</option>`).join('')}</select></div><button class="btn primary block" data-action="save-custom">${icon('check')} Lagre øvelse</button></div>`}
if(t==='detail'){const e=getEx(id),stats=exStats(id),g=goal(id),recent=stats.logs.slice(0,5);title=e.name;html=`<p class="muted small">${esc(e.group)} · ${esc(e.equipment)}</p><div class="stat-grid" style="margin-top:13px"><div class="card stat"><div class="label">Tyngste arbeidssett</div><div class="value">${stats.totalSets?fmt(stats.bestWeight,2)+' kg':'–'}</div></div><div class="card stat"><div class="label">Estimert 1RM</div><div class="value">${stats.best1rm?fmt(stats.best1rm,1)+' kg':'–'}</div></div></div><div class="card" style="margin-top:10px"><strong>Utvikling</strong>${chartSvg(id)}</div><div class="section"><h2>Ditt mål</h2></div><div class="card"><div class="field-inline"><div class="field"><label for="target-weight">Målvekt (kg)</label><input id="target-weight" type="number" inputmode="decimal" min="0.5" max="2000" step="0.5" value="${g?g.targetWeight:stats.bestWeight||20}"></div><div class="field"><label for="target-reps">Repetisjoner</label><input id="target-reps" type="number" inputmode="numeric" min="1" max="100" value="${g?g.targetReps:8}"></div></div><div class="btn-row" style="margin-top:11px"><button class="btn primary" data-action="save-goal" data-id="${esc(id)}">${icon('target',17)} ${g?'Oppdater mål':'Sett mål'}</button>${g?`<button class="btn danger" data-action="delete-goal" data-id="${esc(id)}">Fjern mål</button>`:''}</div>${g?`<div style="margin-top:10px">${goalCardInline(g)}</div>`:''}</div><div class="section"><h2>De siste øktene</h2></div>${recent.length?recent.map(r=>`<div class="card pad-sm"><div class="row between"><strong>${formatDate(r.w.date)}</strong><span class="muted tiny">${fmt(r.sets.reduce((n,s)=>n+s.weight*s.reps,0))} kg volum</span></div><div class="lastline">${r.sets.map(s=>`<span>${fmt(s.weight,2)} kg × ${s.reps}</span>`).join('')}</div></div>`).join(''):`<div class="card empty">Ingen treningshistorikk for øvelsen.</div>`}${e.id.startsWith('custom-')?`<button class="btn danger block" style="margin-top:12px" data-action="delete-custom" data-id="${esc(id)}">Slett egen øvelse</button>`:''}`}
if(t==='history'){const w=workouts().find(x=>x.id===id);if(!w){closeModal();return}title=w.name;html=`<p class="muted small" style="margin-bottom:14px">${formatDate(w.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><div class="stat-grid"><div class="card stat"><div class="label">Totalt volum</div><div class="value">${fmt(vol(w))}<span class="unit"> kg</span></div></div><div class="card stat"><div class="label">Arbeidssett</div><div class="value">${w.entries.reduce((sum,e)=>sum+workSets(e).length,0)}</div></div></div>${w.entries.map(e=>`<div class="card pad-sm" style="margin-top:10px"><strong>${esc(getEx(e.exId).name)}</strong><div class="lastline">${e.sets.map(s=>`<span>${s.kind==='warmup'?'O: ':''}${fmt(s.weight,2)} kg × ${s.reps}</span>`).join('')}</div></div>`).join('')}${w.note?`<p class="muted small" style="margin-top:12px">Notat: ${esc(w.note)}</p>`:''}<div class="btn-row" style="margin-top:16px"><button class="btn" data-action="edit-history" data-id="${esc(w.id)}">${icon('edit',17)} Rediger</button><button class="btn" data-action="template-from-history" data-id="${esc(w.id)}">${icon('book',17)} Lag mal</button></div><div class="btn-row" style="margin-top:8px"><button class="btn" data-action="repeat-history" data-id="${esc(w.id)}">${icon('forward',17)} Gjenta økt</button><button class="btn danger" data-action="delete-history" data-id="${esc(w.id)}">${icon('trash',17)} Slett</button></div>`}
if(t==='template'){title='Lagre treningsmal';html=`<p class="muted small">Lagrer øvelsene og antall sett. Neste gang foreslås belastningen fra siste registrerte økt.</p><div class="field" style="margin:16px 0"><label for="template-name">Navn på malen</label><input id="template-name" maxlength="80" value="${esc((draft()?.name||'Min treningsøkt'))}"></div><button class="btn primary block" data-action="save-template" data-id="${esc(id)}">${icon('check')} Lagre mal</button>`}
if(!title)return;document.getElementById('overlay-root').innerHTML=modalShell(title,html,large);document.body.style.overflow='hidden';}
function goalCardInline(g){const r=goalResult(g);return `<div class="muted small">${r.achieved?'✓ Mål oppnådd!':`Fremdrift: ${r.pct} %`}</div><div class="progress"><div style="width:${r.pct}%"></div></div>`}
function setTab(id){tab=id;closeModal();render();window.scrollTo(0,0)}
function startEmpty(name='Treningsøkt',items=[]){const pid=profile().id;S.drafts[pid]={id:eid(),profileId:pid,name,startedAt:new Date().toISOString(),date:dateTime(),note:'',entries:items.map(item=>{const recent=lastSets(item.exId);const count=Math.min(10,Math.max(1,Number(item.count)||recent.length||3));return {id:eid(),exId:item.exId,sets:Array.from({length:count},(_,i)=>normalSet({weight:recent[i]?.weight??recent.at(-1)?.weight??0,reps:recent[i]?.reps??recent.at(-1)?.reps??8,kind:'work',done:false}))}})};setTab('train');saveSoon()}
function startFromWorkout(w){startEmpty(w.name,(w.entries||[]).map(e=>({exId:e.exId,count:workSets(e).length||e.sets.length||1})))}
function setFind(entryId,setId){const e=draft()?.entries.find(x=>x.id===entryId);return e?.sets.find(x=>x.id===setId)}
function addExercise(exId){const d=draft();if(!d)return;const prev=lastSets(exId,d.editingId||'');d.entries.push({id:eid(),exId,sets:(prev.length?prev:[{weight:0,reps:8},{weight:0,reps:8},{weight:0,reps:8}]).slice(0,12).map(s=>normalSet({...s,kind:'work',done:false}))});closeModal();update();toast('Øvelse lagt til')}
function completeWorkout(){const d=draft();if(!d)return;const entries=d.entries.map(e=>({...e,sets:e.sets.filter(s=>s.done&&s.reps>0).map(normalSet)})).filter(e=>e.sets.length);if(!entries.length){toast('Marker minst ett sett som fullført');return}if(!d.name.trim()){toast('Skriv inn navn på økten');return}const invalid=entries.some(e=>e.sets.some(s=>s.weight<0||s.weight>MAX_WEIGHT||s.reps<=0||s.reps>MAX_REPS));if(invalid){toast('Kontroller vekt og repetisjoner');return}const prev=S.workouts.filter(w=>w.id!==d.editingId);const record={id:d.editingId||eid(),profileId:profile().id,name:d.name.trim().slice(0,80),date:d.date||dateTime(),startedAt:d.startedAt||new Date().toISOString(),note:(d.note||'').slice(0,500),entries};const n=recentPRs(record,prev);const idx=S.workouts.findIndex(w=>w.id===record.id);if(idx>=0)S.workouts[idx]=record;else S.workouts.push(record);delete S.drafts[profile().id];restUntil=0;setTab('history');saveSoon();toast(`Økten er lagret${n?' · '+n+' ny(e) vekt-PR!':''}`)}
function buildTemplate(name,entries){const items=entries.map(e=>({exId:e.exId,count:e.sets?.length||3})).filter(e=>getEx(e.exId).name!=='Slettet øvelse');if(!items.length){toast('Legg til minst én øvelse først');return false}S.templates.push({id:eid(),profileId:profile().id,name:name.slice(0,80),items});update();return true}
function restLabel(){if(!restUntil)return 'Start '+S.settings.restSeconds+' s';const remain=Math.ceil((restUntil-Date.now())/1000);return remain<=0?'Ferdig ✓':`${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}`}
function updateTimerDisplay(){const el=document.getElementById('rest-timer');if(el)el.innerHTML=icon('timer',17)+' '+restLabel();if(restUntil&&Date.now()>restUntil){restUntil=0;toast('Hvilepausen er ferdig')}}
function doClick(el){const action=el.dataset.action,id=el.dataset.id||'',eidVal=el.dataset.entry||'',sid=el.dataset.set||'';switch(action){
case 'tab':setTab(id);break;case 'settings':showModal('settings');break;case 'profiles':showModal('profiles');break;case 'close-modal':closeModal();break;
case 'close-backdrop':if(el.classList.contains('overlay'))closeModal();break;

case 'favorite':{const fav=profile().favorites||(profile().favorites=[]);const index=fav.indexOf(id);if(index>=0)fav.splice(index,1);else fav.push(id);update();break}
case 'add-set':{const e=draft()?.entries.find(x=>x.id===id);if(e){const prev=e.sets.at(-1)||{weight:0,reps:8};e.sets.push(normalSet({...prev,done:false}));update()}break}
case 'remove-set':{const e=draft()?.entries.find(x=>x.id===id);if(e?.sets.length>1){e.sets.pop();update()}break}
case 'toggle-kind':{const s=setFind(eidVal,sid);if(s){s.kind=s.kind==='warmup'?'work':'warmup';update()}break}
case 'toggle-done':{const s=setFind(eidVal,sid);if(s){s.done=!s.done;update();if(s.done&&!s.kind?.includes('warmup')&&S.settings.restSeconds)restUntil=Date.now()+S.settings.restSeconds*1000}break}
case 'remove-ex':if(confirm('Fjerne denne øvelsen fra den pågående økten?')){const d=draft();d.entries=d.entries.filter(e=>e.id!==id);update()}break;
case 'discard-draft':{const d=draft();if(confirm(d.editingId?'Avbryte redigeringen? Originaløkten beholdes.':'Avslutte og slette den pågående økten?')){delete S.drafts[profile().id];restUntil=0;setTab('train');saveSoon()}break}
case 'finish-workout':completeWorkout();break;case 'rest-toggle':restUntil=restUntil?0:Date.now()+Number(S.settings.restSeconds)*1000;updateTimerDisplay();break;
case 'repeat-last':if(draft()){toast('Fullfør eller avslutt gjeldende økt først');break}if(workouts()[0])startFromWorkout(workouts()[0]);break;
case 'start-template':{if(draft()){toast('Fullfør eller avslutt gjeldende økt først');break}const x=S.templates.find(y=>y.id===id&&y.profileId===profile().id);if(x)startEmpty(x.name,x.items);break}
case 'delete-template':if(confirm('Slette treningsmalen?')){S.templates=S.templates.filter(x=>x.id!==id);update()}break;
case 'save-template-draft':showModal('template');break;case 'template-from-history':showModal('template',id);break;
case 'save-template':{const name=document.getElementById('template-name')?.value.trim();if(!name){toast('Skriv inn navn på malen');break}const w=id?workouts().find(w=>w.id===id):draft();if(w&&buildTemplate(name,w.entries)){closeModal();toast('Treningsmal lagret')}break}
case 'month-prev':historyCursor=new Date(historyCursor.getFullYear(),historyCursor.getMonth()-1,1);selectedDay='';render();break;
case 'month-next':historyCursor=new Date(historyCursor.getFullYear(),historyCursor.getMonth()+1,1);selectedDay='';render();break;
case 'choose-day':selectedDay=selectedDay===id?'':id;render();break;case 'clear-day':selectedDay='';render();break;
case 'history-view':showModal('history',id);break;
case 'edit-history':{if(draft()){toast('Fullfør eller avslutt gjeldende økt før redigering');break}const w=workouts().find(x=>x.id===id);if(!w)break;S.drafts[profile().id]={id:eid(),profileId:profile().id,editingId:w.id,name:w.name,date:w.date,note:w.note||'',startedAt:w.startedAt,entries:w.entries.map(e=>({id:eid(),exId:e.exId,sets:e.sets.map(s=>normalSet({...s,done:true}))}))};setTab('train');saveSoon();break}
case 'repeat-history':{if(draft()){toast('Fullfør eller avslutt gjeldende økt først');break}const w=workouts().find(x=>x.id===id);if(w)startFromWorkout(w);break}
case 'delete-history':if(confirm('Slette denne treningsøkten permanent?')){S.workouts=S.workouts.filter(w=>w.id!==id);closeModal();update();toast('Økten er slettet')}break;
case 'save-goal':{const w=safeNum(document.getElementById('target-weight')?.value),r=safeNum(document.getElementById('target-reps')?.value);if(w<=0||w>MAX_WEIGHT||r<1||r>100||!Number.isInteger(r)){toast('Angi gyldig målvekt og antall repetisjoner');break}const goals=profile().goals||(profile().goals=[]);const current=goals.find(g=>g.exId===id);if(current){current.targetWeight=w;current.targetReps=r}else goals.push({exId:id,targetWeight:w,targetReps:r});update();showModal('detail',id);toast('Mål lagret');break}
case 'delete-goal':profile().goals=profile().goals.filter(g=>g.exId!==id);update();showModal('detail',id);break;
case 'create-profile':{const name=document.getElementById('profile-name')?.value.trim();if(!name){toast('Skriv inn profilnavn');break}if(name.length>40){toast('Profilnavnet er for langt');break}const id2=eid();S.profiles.push({id:id2,name,createdAt:new Date().toISOString(),favorites:[],goals:[]});S.activeProfileId=id2;update();showModal('profiles');toast('Profil opprettet');break}
case 'switch-profile':if(S.profiles.some(p=>p.id===id)){S.activeProfileId=id;analyticsEx='';setTab('home');saveSoon()}break;
case 'rename-profile':{const p=S.profiles.find(x=>x.id===id);if(!p)break;const name=prompt('Nytt profilnavn:',p.name);if(name===null)break;if(!name.trim()||name.trim().length>40){toast('Profilnavn må ha 1–40 tegn');break}p.name=name.trim();update();showModal('profiles');break}
case 'delete-profile':{if(S.profiles.length<=1){toast('Minst én profil må beholdes');break}const p=S.profiles.find(x=>x.id===id);if(!p)break;if(confirm(`Slette ${p.name} og ALLE tilhørende treningsdata? Dette kan ikke angres.`)&&confirm('Bekreft permanent sletting av profil, økter og mål.')){S.profiles=S.profiles.filter(x=>x.id!==id);S.workouts=S.workouts.filter(x=>x.profileId!==id);S.templates=S.templates.filter(x=>x.profileId!==id);S.customExercises=S.customExercises.filter(x=>x.profileId!==id);delete S.drafts[id];if(S.activeProfileId===id)S.activeProfileId=S.profiles[0].id;analyticsEx='';update();showModal('profiles');toast('Profil slettet')}break}
case 'backup':showModal('backup');break;case 'export-json':exportBackup();break;
case 'save-custom':{const name=document.getElementById('custom-name')?.value.trim()||'',group=document.getElementById('custom-group')?.value,equipment=document.getElementById('custom-equip')?.value;if(!name){toast('Skriv inn øvelsesnavn');break}if(exercises().some(e=>e.name.toLowerCase()===name.toLowerCase())){toast('Øvelsen finnes allerede');break}S.customExercises.push({id:'custom-'+eid(),profileId:profile().id,name:name.slice(0,75),group,equipment});update();closeModal();toast('Egen øvelse opprettet');break}
case 'delete-custom':{if(confirm('Slette den egendefinerte øvelsen? Eksisterende økter vil beholde settene, men mangle øvelsesnavn.')){S.customExercises=S.customExercises.filter(e=>e.id!==id);profile().favorites=profile().favorites.filter(x=>x!==id);update();closeModal()}break}
default:break}}
function doInput(el){const bind=el.dataset.bind;if(!bind)return;const value=el.value;switch(bind){
case 'draft-name':if(draft()){draft().name=value.slice(0,80);saveSoon()}break;
case 'draft-note':if(draft()){draft().note=value.slice(0,500);saveSoon()}break;
case 'draft-date':if(draft()&&/^\d{4}-\d{2}-\d{2}$/.test(value)){draft().date=value+'T'+(draft().date.split('T')[1]||'12:00');saveSoon()}break;
case 'set-weight':case 'set-reps':{const s=setFind(el.dataset.entry,el.dataset.set);if(s){let v=Number(value.replace(',','.'));if(!Number.isFinite(v)||v<0){el.setAttribute('aria-invalid','true');break}if(bind==='set-reps')v=Math.min(MAX_REPS,Math.floor(v));else v=Math.min(MAX_WEIGHT,v);if(bind==='set-weight')s.weight=v;else s.reps=v;el.removeAttribute('aria-invalid');saveSoon()}break}
case 'exercise-search':exerciseQuery=value;document.getElementById('exercise-list').innerHTML=renderExerciseRows(exerciseQuery,filterGroup,false);break;
case 'choose-search':modalQuery=value;document.getElementById('choose-list').innerHTML=renderExerciseRows(modalQuery,'Alle',true);break;
case 'analytics-ex':analyticsEx=value;render();break;
case 'theme':S.settings.theme=value==='light'?'light':'dark';update();drawModal();break;
case 'increment':S.settings.increment=Number(value);update();drawModal();break;
case 'rest-seconds':S.settings.restSeconds=Number(value);update();drawModal();break;
default:break}}
function exportBackup(){const stamp=dateLocal(),file=`Codex-Training-backup-${stamp}.json`;S.backupAt=new Date().toISOString();saveSoon();const payload={app:'codex-training',backupVersion:1,exportedAt:S.backupAt,state:S};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=file;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);drawModal();toast('Sikkerhetskopi opprettet')}
function validBackup(obj){if(!obj||obj.app!=='codex-training'||obj.backupVersion!==1||!obj.state)throw Error('Filen er ikke en gyldig Codex Training-sikkerhetskopi.');const x=obj.state;if(x.version!==1||!Array.isArray(x.profiles)||x.profiles.length<1||!Array.isArray(x.workouts)||!Array.isArray(x.templates)||!Array.isArray(x.customExercises)||typeof x.drafts!=='object'||!x.settings)throw Error('Sikkerhetskopien mangler nødvendige data.');if(x.profiles.length>100||x.workouts.length>100000||x.customExercises.length>5000)throw Error('Filen inneholder uvanlig store datamengder.');if(!x.profiles.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.goals)&&Array.isArray(p.favorites))||!x.workouts.every(w=>typeof w.profileId==='string'&&Array.isArray(w.entries)&&typeof w.date==='string')||!x.templates.every(t=>Array.isArray(t.items)))throw Error('Sikkerhetskopien inneholder ugyldige oppføringer.');if(!x.profiles.some(p=>p.id===x.activeProfileId))x.activeProfileId=x.profiles[0].id;x.settings.theme=x.settings.theme==='light'?'light':'dark';x.settings.increment=[.5,1,1.25,2,2.5,5].includes(+x.settings.increment)?+x.settings.increment:2.5;x.settings.restSeconds=[60,90,120,150,180,240].includes(+x.settings.restSeconds)?+x.settings.restSeconds:90;return x}
async function importBackup(file){if(!file)return;if(file.size>15*1024*1024){toast('Filen er for stor (maks 15 MB)');return}try{const parsed=JSON.parse(await file.text()),restored=validBackup(parsed);if(!confirm(`Gjenopprette ${restored.profiles.length} profiler og ${restored.workouts.length} økter? Alle nåværende data erstattes.`))return;const before=S;S=restored;try{await saveState()}catch(e){S=before;throw Error('Kunne ikke lagre dataene på denne enheten. Ingen data ble erstattet.')}closeModal();tab='home';selectedDay='';analyticsEx='';render();toast('Sikkerhetskopi gjenopprettet')}catch(e){alert('Import mislyktes: '+e.message)}}
window.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='close-backdrop'&&ev.target!==el)return;doClick(el)});
window.addEventListener('input',ev=>{if(ev.target.dataset?.bind)doInput(ev.target)});
window.addEventListener('change',ev=>{if(ev.target.id==='backup-file'){importBackup(ev.target.files?.[0]);return}if(ev.target.dataset?.bind&&!['exercise-search','choose-search'].includes(ev.target.dataset.bind))doInput(ev.target)});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal)closeModal()});
window.addEventListener('pagehide',()=>{if(S)saveState().catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S)saveState().catch(()=>{})});
async function boot(){const loaded=await loadState();if(loaded?.version===1&&loaded.profiles?.length&&loaded.settings&&Array.isArray(loaded.workouts)){S=loaded}else{S=seed();await saveState().catch(console.error)}document.documentElement.dataset.theme=S.settings.theme||'dark';render();restTicker=setInterval(updateTimerDisplay,1000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
boot().catch(err=>{console.error(err);document.getElementById('app').innerHTML='<div class="page"><h1>Appen kunne ikke startes</h1><p>Kontroller lagringstillatelser og åpne siden på nytt.</p></div>'});
</script></body></html>
